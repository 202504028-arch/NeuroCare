<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama - NeuroCare</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/memorama.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/INICIO_PACIENTE.css') }}">
</head>
<body>

    <div class="contenedorJuego">

        <!-- Barra superior del juego -->
        <div class="barraJuego">
            <a href="/actividades" class="botonRedondo">
                <span>&#8592;</span>
            </a>

            <div class="tituloJuego">
                <p class="categoria">COGNITIVA</p>
                <h1>Memorama</h1>
            </div>

            <div class="botonRedondo" id="btnReiniciar">
                <span>&#8635;</span>
            </div>
        </div>

        <!-- Estadisticas -->
        <div class="estadisticas">
            <div class="tarjetaStat">
                <p class="etiquetaStat">TIEMPO</p>
                <p class="valorStat" id="tiempo">00:00</p>
            </div>
            <div class="tarjetaStat">
                <p class="etiquetaStat">INTENTOS</p>
                <p class="valorStat" id="intentos">0</p>
            </div>
            <div class="tarjetaStat">
                <p class="etiquetaStat">PAREJAS</p>
                <p class="valorStat" id="parejas">0/8</p>
            </div>
        </div>

        <!-- Tablero -->
        <div class="tablero" id="tablero">
            <!-- las 16 cartas se generan con JS -->
        </div>

        <!-- Mensaje de victoria -->
        <div class="mensajeVictoria" id="mensajeVictoria">
            <div class="cajaVictoria">
                <h2>&#127881; ¡Felicidades!</h2>
                <p>Completaste el Memorama</p>
                <p id="resumenVictoria"></p>
                <button id="btnJugarOtraVez">Jugar otra vez</button>
                <a href="/actividades" class="botonVolver">Volver a Actividades</a>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/memorama.js') }}"></script>
</body>
</html>
